name: Phase 2 Web

on:
  pull_request:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase2-web.yml'

jobs:
  build:
    name: web unit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run domain:build
      - run: npm run build --workspace=@seren/web
